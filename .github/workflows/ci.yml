name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload the current screenshot
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot
          path: dist/screenshot.png
          if-no-files-found: ignore
