name: HACS validation

# Runs the HACS validation on demand and every day, without ignoring any check, as HACS requires to be listed. The
# release workflow runs it after each release, which is where it checks the release itself.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
